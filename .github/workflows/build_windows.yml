name: Windows

on: [push]

permissions:
  actions: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: '6.10.2'
  CUDA_VERSION_TEST: '13.2.0'
  CUDA_VERSION_RELEASE: '12.9.1'
  CUDA_PATH_BASE: 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA'
  INSTALL_DIR: 'C:\Users\runneradmin\AppData\Local\Programs\MUSEN'

jobs:
  # Verify MUSEN builds with different CUDA versions
  compile-check:
    name: compile-check (CUDA ${{ matrix.cuda }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: '11.2.2' # CUDA 11.0–11.2
            sm: '35'
            msvc_toolset: '14.29'
            cuda_packages: '["cudart", "curand_dev", "nvcc"]'
          - cuda: '11.8.0' # CUDA 11.3–11.8
            sm: '35'
            cuda_packages: '["cudart", "curand_dev", "nvcc", "thrust"]'
          - cuda: '12.9.1' # CUDA 12.x
            sm: '50'
            cuda_packages: '["cudart", "curand_dev", "nvcc", "thrust"]'
          - cuda: '13.2.0' # CUDA 13.x
            sm: '75'
            cuda_packages: '["cudart", "curand_dev", "crt", "nvcc", "nvvm", "thrust"]'

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup MSVC
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64
        toolset: ${{ matrix.msvc_toolset }}

    - name: Install CUDA
      uses: ./.github/actions/setup-cuda
      with:
        cuda-version: ${{ matrix.cuda }}
        sub-packages: ${{ matrix.cuda_packages }}

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2.22
      with:
        key: ${{ matrix.cuda }}
        variant: ccache
        install: binary

    - name: Cache dependencies
      id: deps-cache
      uses: actions/cache@v5
      with:
        path: build/_deps/*-src
        key: deps-src-${{ hashFiles('cmake/Dependencies.cmake') }}

    - name: Configure CMake
      run: >
        cmake -B build -G Ninja
        -DMUSEN_BUILD_GUI=OFF
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_CUDA_ARCHITECTURES=${{ matrix.sm }}
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache
        ${{ steps.deps-cache.outputs.cache-hit == 'true' && '-DFETCHCONTENT_FULLY_DISCONNECTED=ON' || '' }}

    - name: Build Release
      run: cmake --build build --config Release --parallel

    - name: Cleanup old ccaches
      if: always()
      shell: pwsh
      run: |
        $caches = gh cache list --key "ccache-${{ matrix.cuda }}" --json id | ConvertFrom-Json
        foreach ($c in $caches) { gh cache delete $c.id 2>$null }
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build Debug, Release, Installer, ModelsCreator
  full-test:
    runs-on: windows-2025

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup MSVC
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        cache: true
        cache-key-prefix: cache-qt
        version: ${{ env.QT_VERSION }}
        arch: win64_msvc2022_64
        setup-python: false

    - name: Install CUDA
      uses: ./.github/actions/setup-cuda
      with:
        cuda-version: ${{ env.CUDA_VERSION_TEST }}
        sub-packages: '["cudart", "curand_dev", "crt", "nvcc", "nvvm", "thrust"]'

    - name: Add Inno Setup to PATH
      shell: pwsh
      run: echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

    - name: Setup ccache
      uses: hendrikmuhs/ccache-action@v1.2.22
      with:
        key: full-test
        variant: ccache
        install: binary
        max-size: 1500M

    - name: Cache dependencies
      id: deps-cache
      uses: actions/cache@v5
      with:
        path: build/_deps/*-src
        key: deps-src-${{ hashFiles('cmake/Dependencies.cmake') }}

    - name: Configure CMake
      run: >
        cmake -B build -G "Ninja Multi-Config"
        -DMUSEN_BUILD_INSTALLER=ON
        -DMUSEN_INSTALLER_SKIP_PREBUILD=ON
        -DCMAKE_CUDA_ARCHITECTURES=75
        -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
        -DCMAKE_C_COMPILER_LAUNCHER=ccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
        -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache
        ${{ steps.deps-cache.outputs.cache-hit == 'true' && '-DFETCHCONTENT_FULLY_DISCONNECTED=ON' || '' }}

    - name: Build Release
      run: cmake --build build --config Release --parallel

    - name: Build Debug
      run: cmake --build build --config Debug --parallel

    - name: Build Installer
      run: cmake --build build --target installer --config Release

    - name: Run Installer
      shell: pwsh
      run: |
        $installer = Resolve-Path "Installers\Installers\MUSEN*.exe"
        Start-Process -FilePath $installer -ArgumentList "/SP- /SILENT /SUPPRESSMSGBOXES /CURRENTUSER" -Wait

    - name: Verify MUSEN starts
      shell: pwsh
      run: |
        $p = Start-Process -FilePath "${{ env.INSTALL_DIR }}\MUSEN.exe" -PassThru
        Start-Sleep -Seconds 5
        if ($p.HasExited) {
          throw "MUSEN.exe exited prematurely with code $($p.ExitCode)"
        }
        Stop-Process -Id $p.Id -Force

    - name: Verify CMUSEN starts
      shell: pwsh
      run: |
        & "${{ env.INSTALL_DIR }}\CMUSEN.exe" -models

    - name: Build ModelsCreator
      shell: pwsh
      run: |
        cmake -B "${{ env.INSTALL_DIR }}\ModelsCreator\build" `
          -G Ninja `
          -S "${{ env.INSTALL_DIR }}\ModelsCreator" `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_C_COMPILER_LAUNCHER=ccache `
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache `
          -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache
        cmake --build "${{ env.INSTALL_DIR }}\ModelsCreator\build" --parallel

    - name: Verify ModelsCreator DLLs
      shell: pwsh
      working-directory: ${{ env.INSTALL_DIR }}
      run: |
        Copy-Item "ModelsCreator\build\*.dll" .
        $output = & ".\CMUSEN.exe" -models
        $output | Write-Host
        foreach ($dll in @("ModelPP.dll", "ModelPW.dll", "ModelSB.dll", "ModelEF.dll")) {
          if (-not ($output | Select-String -Quiet $dll)) {
            throw "ModelsCreator DLL '$dll' not found in CMUSEN -models output"
          }
        }

    - name: Uninstall MUSEN
      shell: pwsh
      run: |
        $uninstaller = Resolve-Path "${{ env.INSTALL_DIR }}\unins000.exe"
        Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait

    - name: Cleanup old ccaches
      if: always()
      shell: pwsh
      run: |
        $caches = gh cache list --key "ccache-full-test" --json id | ConvertFrom-Json
        foreach ($c in $caches) { gh cache delete $c.id 2>$null }
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Full build with CUDA_VERSION_RELEASE and all compute capabilities and publish GitHub Release
  release:
    runs-on: windows-2025
    needs: [compile-check, full-test]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup MSVC
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        cache: true
        cache-key-prefix: cache-qt
        version: ${{ env.QT_VERSION }}
        arch: win64_msvc2022_64
        setup-python: false

    - name: Install CUDA
      uses: ./.github/actions/setup-cuda
      with:
        cuda-version: ${{ env.CUDA_VERSION_RELEASE }}
        sub-packages: '["cudart", "curand_dev", "nvcc", "thrust"]'

    - name: Add Inno Setup to PATH
      shell: pwsh
      run: echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

    - name: Cache dependencies
      id: deps-cache
      uses: actions/cache@v5
      with:
        path: build/_deps/*-src
        key: deps-src-${{ hashFiles('cmake/Dependencies.cmake') }}

    - name: Configure CMake
      run: >
        cmake -B build -G "Ninja Multi-Config"
        -DMUSEN_BUILD_INSTALLER=ON
        ${{ steps.deps-cache.outputs.cache-hit == 'true' && '-DFETCHCONTENT_FULLY_DISCONNECTED=ON' || '' }}

    - name: Build Installer
      run: cmake --build build --target installer --config Release

    - name: Run Installer
      shell: pwsh
      run: |
        $installer = Resolve-Path "Installers\Installers\MUSEN*.exe"
        Start-Process -FilePath $installer -ArgumentList "/SP- /SILENT /SUPPRESSMSGBOXES /CURRENTUSER" -Wait

    - name: Get Version
      id: version
      shell: pwsh
      run: |
        $version = '${{ github.ref_name }}'.TrimStart('v')
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT

    - name: Prepare Release Assets
      shell: pwsh
      run: |
        $v = "${{ steps.version.outputs.VERSION }}"
        $installer = Resolve-Path "Installers\Installers\MUSEN*.exe"
        Copy-Item $installer "MUSEN.${v}.open.setup.exe"
        Compress-Archive -Path "${{ env.INSTALL_DIR }}\*" -DestinationPath "MUSEN.${v}.open.portable.zip"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: 'MUSEN ${{ github.ref_name }}'
        draft: true
        body_path: CHANGELOG
        files: |
          MUSEN.${{ steps.version.outputs.VERSION }}.open.setup.exe
          MUSEN.${{ steps.version.outputs.VERSION }}.open.portable.zip
