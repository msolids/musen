name: Linux

on: [push]

permissions:
  packages: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu18
          - distro: ubuntu20
          - distro: ubuntu22
          - distro: ubuntu24
          - distro: debian11
          - distro: debian12
          - distro: debian13
          - distro: fedora41
          - distro: fedora42
          - distro: rocky8
          - distro: rocky9
          - distro: rocky10

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Log in to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and push Docker image
      uses: docker/build-push-action@v7
      with:
        context: scripts/docker
        file: scripts/docker/${{ matrix.distro }}.dockerfile
        push: true
        tags: ghcr.io/${{ github.repository }}/${{ matrix.distro }}:latest
        cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.distro }}:buildcache
        cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.distro }}:buildcache,mode=max

    - name: Build MUSEN
      run: >
        docker run --rm -e CUDA_SM=75 --volume ${{ github.workspace }}:/mnt/musen_src:ro
        ghcr.io/${{ github.repository }}/${{ matrix.distro }}:latest
        ./build_musen.sh
